<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Wodi's home is wodi.fit. The two Firebase addresses serve the very same files, so
         anyone (or any search engine) arriving there is sent across, path and all, before
         the app starts. Sign-in's own pages under /__/ are Firebase's, not this file. -->
    <script>
      if (/(^|\.)(web\.app|firebaseapp\.com)$/.test(location.hostname)) {
        location.replace('https://wodi.fit' + location.pathname + location.search + location.hash);
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/wodi-mark.svg" />
    <link rel="apple-touch-icon" href="/wodi-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="wodi" />
    <meta name="apple-mobile-web-app-title" content="wodi" />

    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to
         anything other than 0. Roughly forty rules across the app reserve room
         for the notch and the home indicator through --safe-top / --safe-bottom;
         without this attribute every one of them silently computed to zero and
         the app drew under the hardware. Pinch-zoom is deliberately NOT disabled:
         the involuntary zoom this app used to suffer came from sub-16px inputs,
         which variables.css already guards against, and taking scaling away from
         people who need it to read is not a fix. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Paints the browser's own chrome in the app's background instead of the
         default white, so the seam above and below the page disappears. -->
    <meta name="theme-color" content="#0c0d0f" />

    <!-- Standalone mode. iOS grants this only to home-screen installs made from
         Safari — a third-party browser on iOS always keeps its own chrome, and
         no markup here can change that. `black` rather than `black-translucent`
         because a translucent bar hands the page the status-bar strip to fill,
         and not every screen reserves --safe-top for it yet. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Caveat:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=JetBrains+Mono:wght@700&family=Kalam:wght@700&family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
    <title>wodi — Your CrossFit training buddy</title>
    <meta name="description" content="Snap your CrossFit board. Wodi reads the workout, remembers your last weights, answers questions about your training and turns every session into a poster." />
    <link rel="canonical" href="https://wodi.fit/" />

    <!-- Link previews (iMessage, WhatsApp, Slack, social). Square brand icon, so the
         small "summary" card rather than a wide banner that would crop it. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WODI" />
    <meta property="og:url" content="https://wodi.fit/" />
    <meta property="og:title" content="wodi — Your CrossFit training buddy" />
    <meta property="og:description" content="Snap your CrossFit board. Wodi reads the workout, remembers your last weights, answers questions about your training and turns every session into a poster." />
    <meta property="og:image" content="https://wodi.fit/wodi-icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="The wodi logo" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="wodi — Your CrossFit training buddy" />
    <meta name="twitter:description" content="Snap your CrossFit board. Wodi reads the workout, remembers your last weights, answers questions about your training and turns every session into a poster." />
    <meta name="twitter:image" content="https://wodi.fit/wodi-icon-512.png" />

    <!-- Tells search engines this page is an app, not an article. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "wodi",
        "alternateName": "WODI",
        "url": "https://wodi.fit/",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Web, iOS, Android",
        "description": "Your CrossFit training buddy. Snap your box's whiteboard; wodi reads the workout, remembers your weights and PRs, answers questions about your training and turns every session into a poster.",
        "image": "https://wodi.fit/wodi-icon-512.png"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
